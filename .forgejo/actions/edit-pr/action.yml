name: "Edit PR File"
description: 'Mevcut PR branch dosyasını düzenle ve push et'

inputs:
  token:
    required: true
  pr-number:
    required: true
  file-path:
    required: false
    default: ''
  file-content:
    required: false
    default: ''
  content-file:
    description: 'file-content yerine dosya yolu kullan'
    required: false
    default: ''
  commit-message:
    required: false
    default: 'automated edit'
  commit-user:
    required: false
    default: 'Forgejo Bot'
  commit-email:
    required: false
    default: 'forgejo@users.noreply.git'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        FILE_CONTENT: ${{ inputs.file-content }}
        FILE_PATH: ${{ inputs.file-path }}
        CONTENT_FILE: ${{ inputs.content-file }}
        COMMIT_MSG: ${{ inputs.commit-message }}
        GIT_USER: ${{ inputs.commit-user }}
        GIT_EMAIL: ${{ inputs.commit-email }}
        API_TOKEN: ${{ inputs.token }}
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"
        mapfile -t changed_files < <(
          git ls-files --others --exclude-standard
          git diff --name-only
        )
        mkdir -p /tmp/ai_edit_backup
        for f in "${changed_files[@]}"; do
          [[ -f "$f" ]] || continue
          mkdir -p "/tmp/ai_edit_backup/$(dirname "$f")"
          cp "$f" "/tmp/ai_edit_backup/$f"
        done
        response=$(curl -s \
          -H "Authorization: token $API_TOKEN" \
          "$SERVER_URL/api/v1/repos/$REPO/pulls/$PR_NUMBER")
        head_branch=$(echo "$response" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).head.ref))")
        git fetch origin "$head_branch"
        git checkout -f "$head_branch"
        git clean -fd
        for f in "${changed_files[@]}"; do
          [[ -f "/tmp/ai_edit_backup/$f" ]] || continue
          mkdir -p "$(dirname "$f")"
          cp "/tmp/ai_edit_backup/$f" "$f"
        done
        if [[ -n "$FILE_PATH" ]]; then
          if [[ -n "$CONTENT_FILE" ]]; then
            cp "$CONTENT_FILE" "$FILE_PATH"
          else
            printf '%s' "$FILE_CONTENT" > "$FILE_PATH"
          fi
        fi
        git config user.name "$GIT_USER"
        git config user.email "$GIT_EMAIL"
        git add .
        git diff --cached --quiet || git commit -m "$COMMIT_MSG"
        git push origin "$head_branch"
