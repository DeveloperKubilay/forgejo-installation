name: "Create PR"
description: 'Commit and create PR'

inputs:
  base:
    description: 'Base branch to create PR against'
    required: true
    default: 'main'
  token:
    description: 'PAT for creating PR'
    required: true
  add-paths:
    description: 'Paths to add to commit'
    required: false
    default: '.'
  commit-message:
    description: 'Commit message'
    required: false
    default: 'Automated commit'
  pr-branch:
    description: 'Branch to create PR from'
    required: false
    default: 'automated-pr'
  pr-title:
    description: 'PR title'
    required: false
    default: 'Automated PR'
  pr-body:
    description: 'PR body'
    required: false
    default: 'Automated PR'
  pr-condition-cmd:
    description: 'Command to check if PR should be created'
    required: false
    default: git status --porcelain
  pr-assignee:
    description: 'Default assignee for the Pull rrequest'
    required: false
    default: null
  pr-automerge:
    description: 'Whether to automatically merge the Pull Request'
    required: false
    default: 'false'
  commit-user:
    description: 'Username to use for commit'
    required: false
    default: 'Forgejo Bot'
  commit-email:
    description: 'Email to use for commit'
    required: false
    default: 'forgejo@users.noreply.git'



runs:
  using: "composite"
  steps:
    - run: |
        git config --global user.name "${{ inputs.commit-user }}"
        git config --global user.email "${{ inputs.commit-email }}"
      shell: bash
      name: "Configure git"
    - name: "Pre-setup"
      run: |
        git fetch origin "${{ inputs.base }}"
        git checkout -B "${{ inputs.pr-branch }}" "origin/${{ inputs.base }}"
      shell: bash
    - name: "Check changes"
      id: git
      shell: bash
      run: |
        condition_output="$(eval "${{ inputs.pr-condition-cmd }}")"
        if [[ -n "$condition_output" ]]; then
          echo changes=true >> $GITHUB_OUTPUT
        else
          echo changes=false >> $GITHUB_OUTPUT
        fi
    - name: "Commit and create PR"
      if: steps.git.outputs.changes == 'true'
      id: commit
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: |
        git add ${{ inputs.add-paths }}
        git commit -m "${{ inputs.commit-message }}"
        git push --force origin "${{ inputs.pr-branch }}"
        echo "URL:  $GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls"
        assignee_json=''
        if [[ -n "${{ inputs.pr-assignee }}" && "${{ inputs.pr-assignee }}" != 'null' ]]; then
          assignee_json=$(printf '  "assignee": "%s",\n' "${{ inputs.pr-assignee }}")
        fi
        payload=$(printf '{\n%s  "base": "%s",\n  "body": "%s",\n  "head": "%s",\n  "title": "%s"\n}' \
          "$assignee_json" \
          "${{ inputs.base }}" \
          "${{ inputs.pr-body }}" \
          "${{ inputs.pr-branch }}" \
          "${{ inputs.pr-title }}")
        response=$(curl --silent --show-error --fail-with-body -X 'POST' \
          "$GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls" \
          -H 'accept: application/json' \
          -H 'Authorization: token ${{ inputs.token }}' \
          -H 'Content-Type: application/json' \
          -d "$payload")
        pr_number=$(printf '%s' "$response" | tr -d '\n' | sed -n 's/.*"number":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
        if [[ -z "$pr_number" ]]; then
          echo "PR number parse edilemedi" >&2
          echo "$response" >&2
          exit 1
        fi
        echo "PR Number: $pr_number"
        echo pr_number=$pr_number >> $GITHUB_OUTPUT
    - name: "Auto merge PR"
      shell: bash
      if: inputs.pr-automerge == 'true' && steps.git.outputs.changes == 'true' && steps.commit.outputs.pr_number != 'null'
      env:
        PR_NUMBER: ${{ steps.commit.outputs.pr_number }}
        REPO: ${{ github.repository }}
      run: |
          echo "Settig auto merge for PR $PR_NUMBER"
          echo "URL: $GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls/$PR_NUMBER/merge"
          response=$(curl --silent --show-error --fail-with-body -X 'POST' \
            "$GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls/$PR_NUMBER/merge" \
            -H 'accept: application/json' \
            -H 'Authorization: token ${{ inputs.token }}' \
            -H 'Content-Type: application/json' \
            -d '{
            "Do": "merge",
            "merge_when_checks_succeed": true,
            "delete_branch_after_merge": true
            }')
          echo $response
branding:
  icon: 'check'
  color: 'blue'
